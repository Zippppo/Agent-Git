<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Agent-Git icon</title>
  <desc id="desc">Warm square app icon with branching checkpoint nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="16" x2="232" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset="1" stop-color="#f1eee4"/>
    </linearGradient>
    <linearGradient id="accent" x1="56" y1="56" x2="202" y2="202" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c96442"/>
      <stop offset="1" stop-color="#3266ad"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4a3a2a" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <path d="M59 84h62c24 0 42 17 42 40v4" fill="none" stroke="#c96442" stroke-width="18" stroke-linecap="round"/>
  <path d="M59 172h62c24 0 42-17 42-40v-4" fill="none" stroke="#3266ad" stroke-width="18" stroke-linecap="round"/>
  <path d="M161 128h38" fill="none" stroke="#437426" stroke-width="18" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <circle cx="59" cy="84" r="24" fill="#fffefa" stroke="#c96442" stroke-width="10"/>
    <circle cx="59" cy="172" r="24" fill="#fffefa" stroke="#3266ad" stroke-width="10"/>
    <circle cx="161" cy="128" r="30" fill="#fffefa" stroke="url(#accent)" stroke-width="12"/>
    <circle cx="199" cy="128" r="22" fill="#fffefa" stroke="#437426" stroke-width="10"/>
  </g>
  <circle cx="161" cy="128" r="8" fill="#141413"/>
</svg>
